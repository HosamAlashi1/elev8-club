<div class="bg-auth">
  <div class="auth-brand"><span class="brand-symbol">E8</span><span>Elev8 <em>Club</em></span></div>
  <div class="auth-kicker">Secure workspace</div>
  <h1>Welcome back.</h1>
  <p class="auth-subtitle">Sign in to your Elev8 Club workspace.</p>

  <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>

    <!-- Alert -->
    <ngb-alert 
      *ngIf="message" 
      [type]="messageType" 
      (closed)="showMsg(false, '')">
      {{ message }}
    </ngb-alert>

    <!-- Email -->
    <div class="form-group mb-3">
      <label class="form-label" for="login-email">Email address</label>
      <input
        id="login-email"
        type="email"
        autocomplete="username"
        class="form-control"
        formControlName="email"
        placeholder="Enter your email"
        [ngClass]="{
          'is-invalid': f.email.invalid && loginForm.touched,
          'is-valid': f.email.valid && loginForm.touched
        }"
      />
    </div>

    <!-- Password -->
    <div class="form-group mb-4">
      <label class="form-label" for="login-password">Password</label>
      <div class="password-input-wrapper">
        <input
          id="login-password"
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          formControlName="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          [ngClass]="{
            'is-invalid': f.password.invalid && loginForm.touched,
            'is-valid': f.password.valid && loginForm.touched
          }"
        />
        <button type="button" class="password-toggle" (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
          <i class="fe" [ngClass]="showPassword ? 'fe-eye-off' : 'fe-eye'"></i>
        </button>
      </div>
    </div>

    <!-- Submit -->
    <button
      type="submit"
      class="btn btn-lg w-100 btn-custom"
      [disabled]="isLoginLoading"
    >
      <ng-container *ngIf="isLoginLoading; else ready">
        <span class="spinner-border spinner-border-sm me-2"></span>
        Signing in...
      </ng-container>

      <ng-template #ready>
        <span>Sign in</span><i class="fe fe-arrow-right" aria-hidden="true"></i>
      </ng-template>
    </button>

  </form>
  <div class="auth-form-foot"><span></span> AUTHORIZED ACCESS ONLY</div>
</div>
