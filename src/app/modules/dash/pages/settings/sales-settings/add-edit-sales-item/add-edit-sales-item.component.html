<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="modal-header">
    <h4 class="modal-title">{{ isEdit ? 'Edit WhatsApp Group' : 'Add WhatsApp Group' }}</h4>
    <button type="button" class="btn-close" (click)="activeModal.dismiss()"></button>
  </div>

  <div class="modal-body">
    <div class="alert alert-light border d-flex align-items-center gap-2 mb-3">
      <i class="fe fe-git-branch text-muted"></i>
      <span>Each group receives up to 1000 members before registrations move to the next group.</span>
    </div>

    <div class="row">
      <div class="col-12 mb-3">
        <label class="form-label">Group Name <span class="text-danger">*</span></label>
        <input 
          class="form-control" 
          formControlName="group_name" 
          placeholder="WhatsApp Group 1"
          [ngClass]="{ 'is-invalid': submitted && f['group_name'].invalid, 'is-valid': submitted && f['group_name'].valid }" />
        <div *ngIf="submitted && f['group_name'].invalid" class="invalid-feedback">
          Group name is required
        </div>
      </div>

      <div class="col-12 mb-3">
        <label class="form-label">WhatsApp Group Invite Link <span class="text-danger">*</span></label>
        <input 
          class="form-control" 
          formControlName="group_link" 
          placeholder="https://chat.whatsapp.com/..."
          [ngClass]="{ 'is-invalid': submitted && f['group_link'].invalid, 'is-valid': submitted && f['group_link'].valid }" />
        <div *ngIf="submitted && f['group_link'].invalid" class="invalid-feedback">
          Group invite link is required
        </div>
        <small class="text-muted">You can paste a full link or chat.whatsapp.com/... and it will be normalized.</small>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss()">Cancel</button>
    <button type="submit" class="btn btn-custom" [disabled]="isSubmitting">
      <ng-container *ngIf="isSubmitting">
        <span class="spinner-border spinner-border-sm me-2"></span>
        Saving...
      </ng-container>
      <ng-container *ngIf="!isSubmitting">
        {{ isEdit ? 'Update' : 'Add' }} WhatsApp Group
      </ng-container>
    </button>
  </div>
</form>
