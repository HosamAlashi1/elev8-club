<div class="mobile-overlay" *ngIf="isMobile && !isCollapsed" (click)="toggleSidebar()"></div>
<nav [ngClass]="{ sidebar: true, collapsed: isCollapsed }" (click)="onSidebarClick($event)">
  <div class="sidebar-atmosphere" aria-hidden="true">
    <div class="sidebar-atmosphere__grid"></div>
    <div class="sidebar-atmosphere__beam"></div>
    <svg class="sidebar-atmosphere__graph" viewBox="0 0 250 900" preserveAspectRatio="xMidYMid slice">
      <path class="sidebar-atmosphere__foundation" d="M-15 270 C50 253 49 290 105 232 S184 268 265 174 M-15 775 C30 756 55 760 83 725 S138 744 165 660 S215 655 265 555" />
      <path class="sidebar-atmosphere__trace sidebar-atmosphere__trace--back" d="M-15 765 C28 745 37 784 78 737 S130 703 155 674 S207 692 265 595" />
      <path class="sidebar-atmosphere__trace sidebar-atmosphere__trace--front" d="M-15 775 C30 756 55 760 83 725 S138 744 165 660 S215 655 265 555" />
      <path class="sidebar-atmosphere__trace sidebar-atmosphere__trace--upper" d="M-15 270 C50 253 49 290 105 232 S184 268 265 174" />
      <circle cx="165" cy="660" r="3" />
      <circle cx="235" cy="604" r="3" />
    </svg>
    <div class="sidebar-atmosphere__columns"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="sidebar-header d-flex align-items-center justify-content-between ps-2 mt-4 mb-4">
    <div class="brand-text" *ngIf="!isCollapsed">
      Elev8 <span>Club</span>
    </div>

    <i class="toggle-icon" [ngClass]="isCollapsed ? 'fe fe-menu' : 'fe fe-chevron-left'" (click)="toggleSidebar()">
    </i>
  </div>

  <ul class="nav flex-column">
    <li *ngFor="let item of menu" class="nav-item mx-3 my-2"
      [ngClass]="{ 'has-children': item.children, open: item.open }">

      <a class="nav-link" [routerLink]="item.children ? null : item.route" routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }" (click)="handleClick(item)"
        [ngClass]="{ toggleable: item.children }" [ngbTooltip]="isCollapsed ? item.label : null" container="body"
        placement="right">

        <div class="nav-content">
          <lucide-icon [name]="item.icon"></lucide-icon>
          <span *ngIf="!isCollapsed">{{ item.label }}</span>
          <span
            class="support-nav-badge"
            *ngIf="item.route === '/dashboard/support-inbox' && (unreadSupportCount$ | async) as count"
          >{{ count > 99 ? '99+' : count }}</span>
        </div>
      </a>

      <ul class="nav sub-menu" *ngIf="item.children">
        <li *ngFor="let sub of item.children" class="nav-item">
          <a class="nav-link" [routerLink]="sub.route" routerLinkActive="active" #rla="routerLinkActive"
            [ngClass]="{ active: rla.isActive }">
            {{ sub.label }}
          </a>
        </li>
      </ul>
    </li>
  </ul>

</nav>
