<section class="hero" aria-label="مقدمة تحدي Elev8 Club">
  <div class="floating-elements" aria-hidden="true">
    <span class="ambient-dot dot-1"></span>
    <span class="ambient-dot dot-2"></span>
    <span class="ambient-dot dot-3"></span>
    <span class="ambient-dot dot-4"></span>
    <span class="ambient-dot dot-5"></span>
    <span class="ambient-dot dot-6"></span>
  </div>

  <div class="brand-mark" data-aos="fade-down" data-aos-delay="60" data-aos-duration="700">ELEV8 CLUB</div>

  <div class="hero__visual" data-aos="fade-left" data-aos-delay="120" data-aos-duration="900">
    <picture>
      <source media="(max-width: 980px)" srcset="assets/images/anima-home/group-111.png" />
      <img src="assets/images/anima-home/group-3.png" alt="Khalil holding the Elev8 Club magic pill" />
    </picture>
  </div>

  <div class="hero__copy" data-aos="fade-right" data-aos-delay="190" data-aos-duration="850">
    <span class="eyebrow">تحدي elev8 club 0.3</span>
    <h1>
      <span class="muted-title">أتحداك تبني دخل</span>
      <span class="hero__line"><span>يومي</span><b data-text="$272">$272</b><span>أونلاين</span></span>
    </h1>
    <p class="hero__sub">خلال ساعة واحدة فقط باستخدام الذكاء الاصطناعي</p>
    <div class="inline-list" aria-label="مزايا التحدي">
      <span>بدون خبرة سابقة</span>
      <img src="assets/images/anima-home/line-2-20.svg" alt="" aria-hidden="true" />
      <span>برأس مال بسيط</span>
      <img src="assets/images/anima-home/line-2-20.svg" alt="" aria-hidden="true" />
      <span>من أي مكان بالعالم</span>
    </div>
    <div class="cta-strip">
      <button class="gold-btn" type="button" (click)="onOpenRegistration()">
        <span class="gold-btn__label">احجز مقعدك مجاناً</span>
        <span class="orbit"></span>
        <span class="orbit"></span>
      </button>
      <p>عرضت هذا النظام على مبتدئين بالكامل مرتين… وقدروا يحققوا ألاف الدولارات خلال أقل من 30 يوم فقط … والآن جاء دورك تعملها خلال ساعة واحدة</p>
    </div>
  </div>
</section>
