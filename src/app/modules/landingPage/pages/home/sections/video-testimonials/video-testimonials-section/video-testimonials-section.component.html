<section class="video-section">
  <div class="vt-inner">
    <div class="section-head" data-aos="fade-up" data-aos-delay="80">
      <span class="eyebrow">نتائج من النسخ السابقة</span>
      <h2>هاد النظام ينجح مهما كان وضعك الحالي</h2>
      <p>أول مرتين أطلقنا فيهم هذا التحدي المباشر... شفنا أشخاص من ظروف وحياة مختلفة تماماً يحققوا نتائج حقيقية.</p>
    </div>

    <div class="proof-layout">
      <article class="proof-card" *ngFor="let story of stories; let i = index" data-aos="fade-up" [attr.data-aos-delay]="140 + i * 130">
        <div class="proof-copy">
          <span class="proof-badge">{{ story.badge }}</span>
          <h3>{{ story.name }}</h3>
          <strong>{{ story.amount }}</strong>
          <p>{{ story.description }}</p>
        </div>
        <div class="proof-image">
          <img [src]="story.image" [alt]="story.name" loading="lazy">
        </div>
      </article>
    </div>
  </div>
</section>
