<section class="results-section" data-aos="fade-up">
  <div class="results-inner">

    <div class="results-head" data-aos="fade-up" data-aos-delay="60">
      <span class="results-eyebrow">نتائج من النسخ السابقة</span>
      <h2 class="results-title">
        هاد النظام بنجح
        <span class="results-title-accent">مهماكان وضعك الحالي</span>
      </h2>
      <p class="results-sub">أول مرتين أطلقنا فيه هذا التحدي المباشر… شفنا أشخاص من ظروف وحياة مختلفة تماماً يحققوا نتائج حقيقية</p>
    </div>

    <div class="proof-grid" data-aos="fade-up" data-aos-delay="120">
      <article class="proof-card" *ngFor="let story of stories; let i = index" [attr.data-aos-delay]="140 + i * 100" data-aos="fade-up">
        <div class="proof-card-head">
          <span class="proof-badge">{{ story.badge }}</span>
          <strong class="proof-amount">{{ story.amount }}</strong>
        </div>
        <div class="proof-card-body">
          <h3 class="proof-name">{{ story.name }}</h3>
          <p class="proof-desc">{{ story.description }}</p>
        </div>
        <div class="proof-card-image">
          <img [src]="story.image" [alt]="story.name" loading="lazy" />
        </div>
      </article>
    </div>

  </div>
</section>
