<section class="target-section" data-aos="fade-up">
  <div class="target-inner">

    <div class="target-head" data-aos="fade-up" data-aos-delay="60">
      <h2 class="target-title">مين بيحتاج هاد؟</h2>
      <p class="target-sub">إذا كنت ضمن واحد من هذه الحالات، فهذا التحدي معمول لك.</p>
    </div>

    <div class="personas-grid">
      <article
        class="persona-card"
        *ngFor="let p of personas; let i = index"
        data-aos="fade-up"
        [attr.data-aos-delay]="100 + i * 80"
      >
        <div class="persona-icon-wrap" aria-hidden="true">
          <lucide-angular [name]="p.icon" [size]="22" class="persona-lucide-icon"></lucide-angular>
        </div>
        <div class="persona-body">
          <h3 class="persona-title">{{ p.title }}</h3>
          <p class="persona-desc">{{ p.desc }}</p>
        </div>
      </article>
    </div>

  </div>
</section>
