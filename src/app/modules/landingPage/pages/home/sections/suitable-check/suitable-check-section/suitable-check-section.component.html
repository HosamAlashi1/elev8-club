<section class="target-section" data-aos="fade-up">
  <div class="target-inner">
    <div class="section-head" data-aos="fade-up" data-aos-delay="80">
      <span class="section-index">02</span>
      <h2 class="main-title">مين بيحتاج هاد؟</h2>
      <p class="section-subtitle">إذا كنت ضمن واحد من هذه الحالات، فهذا التحدي معمول لك.</p>
    </div>

    <div class="target-note" data-aos="fade-up" data-aos-delay="110">
      <span>الهدف من هذا الجزء</span>
      <p>تفهم هل التحدي مناسب لك قبل ما تدخل في التفاصيل: كيف يعمل النظام، ولماذا الفرصة مختلفة الآن.</p>
    </div>

    <div class="personas-grid">
      <article
        class="persona-card"
        *ngFor="let p of personas; let i = index"
        data-aos="fade-up"
        [attr.data-aos-delay]="120 + i * 70"
      >
        <div class="persona-icon" aria-hidden="true">
          <lucide-angular [name]="p.icon" class="persona-lucide-icon"></lucide-angular>
        </div>
        <div class="persona-content">
          <h3 class="persona-title">{{ p.title }}</h3>
          <p class="persona-desc">{{ p.desc }}</p>
        </div>
      </article>
    </div>
  </div>
</section>
