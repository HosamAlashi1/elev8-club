<section class="screens-section">
  <div class="screens-inner">
    <div class="screens-head" data-aos="fade-left" data-aos-delay="80">
      <span class="screens-eyebrow">سكرينات</span>
      <h2>عندي حرفيا مئات الـ screenshots ومئات النتائج</h2>
      <p>لأشخاص قدروا يتخلصوا من ضغطهم المالي ويحققوا نتائج حقيقة بعد حضورهم التدريب وتطبيق نظامنا المتكامل.</p>
    </div>

    <div class="screens-media" data-aos="zoom-in" data-aos-delay="180">
      <img src="assets/images/canva/trading-screenshot.webp" alt="نتيجة تداول حقيقية" loading="lazy" decoding="async">
    </div>

    <div class="screens-details" data-aos="fade-up" data-aos-delay="220">
      <div class="promise-card">
        <p>
          يوم <strong>20/5</strong> راح أفرجيك بشكل مباشر قدام الكاميرا خطوة خطوة كيف ناس كثير قدروا يبدؤوا بالتداول بالطريقة الصح وكيف أنت كمان تقدر تعمل نفس الشي
        </p>
      </div>

      <button class="btn-cta btn-cta-primary btn-cta-lg" (click)="onOpenRegistration()">
        <span class="btn-cta-text">احجز مقعدك مجانًا</span>
        <div class="ripple-gold"></div>
      </button>
    </div>
  </div>
</section>
