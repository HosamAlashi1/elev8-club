<section class="audience" aria-labelledby="audience-heading">
  <div class="audience__glow" aria-hidden="true"></div>

  <div class="shell">
    <div class="section-heading" data-aos="fade-up" data-aos-duration="700">
      <span class="side-line"></span>
      <div>
        <h2 id="audience-heading">مين بيحتاج هاد؟</h2>
        <p>إذا كنت ضمن واحد من هذه الحالات، فهذا التحدي معمول لك</p>
      </div>
      <span class="side-line"></span>
    </div>

    <div class="audience-grid">
      <article
        class="mini-card"
        *ngFor="let card of cards; let i = index"
        data-aos="fade-up"
        data-aos-duration="650"
        [attr.data-aos-delay]="120 + i * 70"
      >
        <lucide-angular [name]="card.icon" [size]="22" aria-hidden="true"></lucide-angular>
        <h3>{{ card.title }}</h3>
        <p>{{ card.desc }}</p>
      </article>
    </div>
  </div>
</section>
