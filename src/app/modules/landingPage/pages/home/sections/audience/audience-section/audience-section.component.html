<section class="audience" aria-labelledby="audience-heading">
  <div class="audience__glow" aria-hidden="true"></div>

  <div class="shell">
    <div class="section-heading">
      <span class="side-line"></span>
      <div>
        <h2 id="audience-heading">هل هذا أنت !</h2>
        <p data-aos="fade-up" data-aos-duration="700">إذا كنت ضمن واحدة من الحالات هذا التحدي معمول الك</p>
      </div>
      <span class="side-line"></span>
    </div>

    <div class="audience-grid">
      <article
        class="mini-card"
        *ngFor="let card of cards; let i = index"
        data-aos="fade-up"
        data-aos-duration="650"
        [attr.data-aos-delay]="120 + i * 70"
      >
        <lucide-angular [name]="card.icon" [size]="22" aria-hidden="true"></lucide-angular>
        <h3>{{ card.title }}</h3>
        <p class="card-problem">{{ card.problem }}</p>
        <p class="card-need">{{ card.need }}</p>
      </article>
    </div>
  </div>
</section>
