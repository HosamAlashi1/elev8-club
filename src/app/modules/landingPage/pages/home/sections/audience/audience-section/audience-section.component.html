<section class="audience" aria-labelledby="audience-heading">
  <div class="audience__glow" aria-hidden="true"></div>

  <div class="shell">
    <div class="section-heading">
      <span class="side-line"></span>
      <div>
        <h2 id="audience-heading"><span class="lp-hl" style="--hl-delay:0.4s">هل هذا أنت؟</span></h2>
        <p data-aos="fade-up" data-aos-duration="700">وهذه التحديات التي تمرّ فيها؟</p>
      </div>
      <span class="side-line"></span>
    </div>

    <div class="audience-grid">
      <article
        class="mini-card"
        *ngFor="let card of cards; let i = index"
        data-aos="fade-up"
        data-aos-duration="650"
        [attr.data-aos-delay]="120 + i * 70"
      >
        <div class="card-head">
          <h3><bdi class="card-number" dir="rtl">{{ i + 1 }}.</bdi> {{ card.title }}</h3>
        </div>
        <p class="card-problem">{{ card.problem }}</p>
      </article>
    </div>
  </div>
</section>
