<section class="cr-section">
  <div class="cr-inner">
    <div class="cr-title-block" data-aos="fade-up" data-aos-delay="80">
      <h2 class="cr-main-title">مراجعة سريعة لتفاصيل التحدي</h2>
    </div>

    <div class="cr-grid">
      <article
        class="cr-card"
        *ngFor="let item of reviewItems; let i = index"
        [ngClass]="'cr-card--' + item.variant"
        data-aos="fade-up"
        [attr.data-aos-delay]="170 + i * 90"
      >
        <div class="cr-card-head">
          <div class="cr-card-icon">
            <lucide-angular [name]="item.icon" [size]="12" class="cr-lucide-icon"></lucide-angular>
          </div>
        </div>
        <h3 class="cr-card-title">{{ item.question }}</h3>
        <ul class="cr-points-list" [class.cr-points-list--schedule]="item.variant === 'schedule'">
          <li *ngFor="let p of item.points" [innerHTML]="p"></li>
        </ul>
      </article>
    </div>

    <div class="cr-cta-wrapper" data-aos="zoom-in" data-aos-delay="620">
      <button class="btn-cta btn-cta-primary btn-cta-lg" (click)="onOpenRegistration()">
        <span class="btn-cta-text">احجز مقعدك مجاناً</span>
        <div class="ripple-gold"></div>
      </button>
    </div>
  </div>
</section>
