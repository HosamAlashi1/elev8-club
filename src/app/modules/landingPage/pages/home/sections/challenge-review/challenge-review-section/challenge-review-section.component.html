<section class="review review--challenge section-shell" aria-labelledby="challenge-review-heading">
  <div class="section-heading" data-aos="fade-up" data-aos-delay="60">
    <span class="side-line" aria-hidden="true"></span>
    <div>
      <h2 id="challenge-review-heading">مراجعة سريعة لتفاصيل التحدي</h2>
      <p>إذا كنت ضمن واحد من هذه الحالات فهذا التحدي معمول لك</p>
    </div>
    <span class="side-line" aria-hidden="true"></span>
  </div>

  <div class="review-grid">
    <article
      *ngFor="let item of reviewItems; let i = index"
      data-aos="fade-up"
      [attr.data-aos-delay]="120 + i * 70"
      data-aos-duration="700"
    >
      <lucide-angular [name]="item.icon" [size]="24" aria-hidden="true"></lucide-angular>
      <h3>{{ item.title }}</h3>
      <p>{{ item.text }}</p>
    </article>
  </div>
</section>
