<section class="wf-section">
  <div class="wf-inner">
    <div class="wf-media" data-aos="fade-left" data-aos-delay="100">
      <img src="assets/images/canva/khalil-main.jpg" alt="خليل القصاصية" loading="lazy">
    </div>

    <div class="wf-copy" data-aos="fade-right" data-aos-delay="140">
      <span class="wf-eyebrow">السؤال المهم</span>
      <h2 class="wf-title">
        <span class="wf-title-line">إذا التداول بيشتغل بهذه الطريقة...</span>
        <span class="wf-title-line wf-title-line--accent">
          <span class="wf-title-focus">ليش أشرح كل هذا <span class="wf-title-word wf-title-word--gold">مجاناً</span>؟</span>
        </span>
      </h2>
      <p class="wf-lead">
        السبب بسيط: النموذج مبني على <span class="wf-inline-accent">شراكة واضحة</span>، أنت تدخل السوق <span class="wf-inline-accent">بدون رسوم إضافية</span>،
        وأنا أستفيد فقط عندما تبدأ فعلياً.
      </p>

      <div class="wf-points">
        <div class="wf-point" *ngFor="let r of reasons; let i = index" data-aos="fade-up" [attr.data-aos-delay]="220 + i * 90">
          <div class="wf-point-icon" aria-hidden="true">
            <lucide-angular [name]="r.icon" class="wf-lucide-icon"></lucide-angular>
          </div>
          <div class="wf-point-copy">
            <h3 [innerHTML]="r.titleHtml"></h3>
            <p [innerHTML]="r.descHtml"></p>
          </div>
        </div>
      </div>

      <div class="wf-summary">
        لهذا السبب، الفكرة هنا ليست بيع كلام نظري، بل <span class="wf-inline-accent">مصالحنا مشتركة</span> من أول خطوة.
      </div>

      <button class="btn-cta btn-cta-primary btn-cta-lg" (click)="onOpenRegistration()">
        <span class="btn-cta-text">احجز مقعدك مجاناً</span>
        <div class="ripple-gold"></div>
      </button>
    </div>
  </div>
</section>
