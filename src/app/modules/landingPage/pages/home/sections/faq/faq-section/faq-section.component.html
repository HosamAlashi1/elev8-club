<section class="faq faq--anima section-shell" aria-labelledby="faq-heading">
  <picture>
    <source type="image/webp" srcset="assets/images/anima-home/faq-question-mark.webp" />
    <img
      class="faq-visual"
      src="assets/images/anima-home/faq-question-mark.png"
      alt=""
      aria-hidden="true"
      loading="lazy"
      decoding="async"
      data-aos="zoom-in"
      data-aos-delay="80"
      data-aos-duration="700"
    />
  </picture>

  <div class="faq-heading">
    <h2 id="faq-heading">الأسئلة الشائعة</h2>
  </div>

  <div class="faq-list" role="list">
    <div
      *ngFor="let faq of faqs; let i = index"
      class="faq-item"
      role="listitem"
      [class.is-open]="faq.open"
      data-aos="fade-up"
      [attr.data-aos-delay]="110 + i * 55"
      data-aos-duration="700"
    >
      <button
        class="faq-question"
        type="button"
        [attr.aria-expanded]="faq.open ? 'true' : 'false'"
        [attr.aria-controls]="'faq-answer-' + i"
        (click)="toggleFaq(i)"
      >
        <span>{{ faq.question }}</span>
      </button>

      <div class="faq-answer" [id]="'faq-answer-' + i">
        <div class="faq-answer-inner">
          <div class="faq-answer-copy" aria-live="polite">{{ faq.answer }}</div>
        </div>
      </div>
    </div>
  </div>
</section>
