<section class="faq faq--anima section-shell" aria-labelledby="faq-heading">
  <img
    class="faq-visual"
    src="assets/images/anima-home/faq-question-mark.svg"
    alt=""
    aria-hidden="true"
    loading="lazy"
    data-aos="zoom-in"
    data-aos-delay="80"
    data-aos-duration="700"
  />

  <div class="faq-heading" data-aos="fade-up" data-aos-delay="60">
    <h2 id="faq-heading">الأسئلة الشائعة</h2>
  </div>

  <div class="faq-list">
    <details
      *ngFor="let faq of faqs; let i = index"
      [attr.open]="faq.open ? '' : null"
      data-aos="fade-up"
      [attr.data-aos-delay]="110 + i * 55"
      data-aos-duration="700"
    >
      <summary>{{ faq.question }}</summary>
      <p>{{ faq.answer }}</p>
    </details>
  </div>
</section>
