<section class="hiw-section" data-aos="fade-up">

  <div class="hiw-inner">

    <div class="hiw-head" data-aos="fade-up" data-aos-delay="60">
      <span class="hiw-eyebrow">الآلية</span>
      <h2 class="hiw-title">كيف هاي الطريق بتشتغل ؟</h2>
      <p class="hiw-sub">
        التداول هو نفس التجارة الموجودة على أرض الواقع… لكن بشكل أونلاين داخل الأسواق المالية.
      </p>
    </div>

    <div class="hiw-steps">
      <div
        class="hiw-step"
        *ngFor="let step of steps; let i = index"
        data-aos="fade-up"
        [attr.data-aos-delay]="100 + i * 110"
      >
        <div class="hiw-step-num-wrap">
          <span class="hiw-step-num">{{ step.num }}</span>
        </div>
        <div class="hiw-step-icon-wrap" aria-hidden="true">
          <lucide-angular [name]="step.icon" [size]="20" class="hiw-step-icon"></lucide-angular>
        </div>
        <div class="hiw-step-body">
          <h3 class="hiw-step-title" [innerHTML]="step.titleHtml"></h3>
          <p class="hiw-step-desc" [innerHTML]="step.descHtml"></p>
        </div>
        <div class="hiw-step-connector" *ngIf="i < steps.length - 1" aria-hidden="true"></div>
      </div>
    </div>

    <div class="hiw-ai-card" data-aos="fade-up" data-aos-delay="500">
      <div class="hiw-ai-icon">✦</div>
      <div class="hiw-ai-text">
        <strong>الذكاء الاصطناعي غيّر كل شيء</strong>
        <p>زمان كان التداول يحتاج شهور من التعلم. اليوم؟ الذكاء الاصطناعي اختصر الطريق بالكامل وصار المبتدئ يبدأ ويحقق أول نتيجة خلال دقائق.</p>
      </div>
    </div>

    <div class="hiw-cta" data-aos="zoom-in" data-aos-delay="620">
      <button class="btn-cta btn-cta-primary btn-cta-lg" (click)="onOpenRegistration()">
        <span class="btn-cta-text">احجز مقعدك مجانًا</span>
        <svg class="btn-cta-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="ripple-gold"></div>
      </button>
    </div>

  </div>
</section>
