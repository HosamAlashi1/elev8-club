<section
  id="learn"
  class="learn-section"
  dir="rtl"
  aria-labelledby="learn-title"
>
  <header class="learn-head">
    <div
      class="learn-head-media"
      aria-hidden="true"
      data-aos="zoom-in-up"
      data-aos-delay="80"
      data-aos-duration="650"
    >
      <img
        class="learn-head-img"
        src="assets/images/anima-home/learn-education.webp"
        alt=""
        loading="lazy"
        decoding="async"
      />
    </div>
    <h2
      id="learn-title"
      class="learn-title"
    >
      جزء من يلي راح تتعلمه :
    </h2>
  </header>

  <div class="learn-scroll-viewport">

  <div class="learn-grid" aria-label="أجزاء المحتوى">
    <div
      class="learn-card-aos"
      *ngFor="let item of parts; let i = index"
    >
      <article class="learn-card">
        <div class="learn-card-head">
          <span class="learn-card-part">{{ item.part }}</span>
          <h3 class="learn-card-title">{{ item.title }}</h3>
        </div>
        <span class="learn-card-line" aria-hidden="true"></span>
        <p class="learn-card-desc">{{ item.description }}</p>
      </article>
    </div>

    <div
      class="learn-card-aos"
    >
      <article class="learn-card learn-card--cta">
        <p class="learn-cta-text">
          الفرصة الأن راح أشرحلك إلك كل هذا مجانًا 100%
        </p>
        <button
          class="learn-cta-btn"
          type="button"
          (click)="onOpenRegistration()"
          aria-label="احجز مقعدك مجاناً"
        >
          احجز مقعدك مجاناً
        </button>
      </article>
    </div>
  </div>
  </div>
</section>
