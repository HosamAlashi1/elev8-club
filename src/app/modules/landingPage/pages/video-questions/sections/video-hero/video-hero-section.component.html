<section class="video-hero-section" dir="rtl" aria-label="إكمال تسجيل Elev8 Club">
  <div class="video-hero-shell">
    <!-- <div class="brand-mark" data-aos="fade-down" data-aos-delay="60">ELEV8 CLUB</div> -->

    <div class="title-wrapper" data-aos="fade-up" data-aos-duration="800">
      <h1 class="main-title">تسجيل شبه مكتمل …</h1>
      <p class="hero-copy">
        شاهد الفيديو بالأسفل ثم أجب على الأسئلة
        <br>
        هيك التسجيل بيكتمل وبتقدر تنضم لمجموعة الواتساب
      </p>
    </div>

    <div
      [@scaleIn]
      class="video-container"
      [class.is-playing]="state === 'playing'"
      data-aos="zoom-in"
      data-aos-duration="900"
      data-aos-delay="120">

      <video
        #videoPlayer
        class="video-player"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
        [poster]="posterUrl"
        disablepictureinpicture
        controlslist="nofullscreen noremoteplayback nodownload"
        (click)="onVideoClick()"
        (error)="onVideoError($event)">
      </video>

      <!-- 1. Loading / buffering -->
      <div class="vsl-spinner" *ngIf="showSpinner" aria-label="جاري التحميل" role="status">
        <span class="vsl-spinner__ring"></span>
      </div>

      <!-- 2. Silent preview: the video already runs; one tap to hear it from the start -->
      <button
        type="button"
        class="vsl-listen"
        *ngIf="state === 'muted' && !hasFatalError"
        (click)="listen()"
        aria-label="الفيديو بدأ — اضغط للاستماع">
        <span class="vsl-listen__box">
          <span class="vsl-listen__top">الفيديو بدأ بالفعل</span>
          <svg class="vsl-listen__icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M8 18h7l10-8v28l-10-8H8z" fill="currentColor" />
            <path d="M31 17c2.5 2 4 4.6 4 7s-1.5 5-4 7M35.5 12.5C40 16 42 20 42 24s-2 8-6.5 11.5" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <path d="M6 6l36 36" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
            <path d="M6 6l36 36" stroke="#c91631" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <span class="vsl-listen__bottom">اضغط هنا لتسمع</span>
        </span>
      </button>

      <!-- 3. Came back mid-video, or finished: continue / start over -->
      <div class="vsl-cover" *ngIf="showCover && !hasFatalError" role="dialog" aria-modal="false" aria-labelledby="vsl-cover-title">
        <p class="vsl-cover__title" id="vsl-cover-title">
          {{ state === 'ended' ? 'خلّصت مشاهدة الفيديو' : 'إنت بدأت تشاهد هذا الفيديو' }}
        </p>
        <div class="vsl-cover__actions">
          <button type="button" class="vsl-cover__btn" *ngIf="state === 'resume'" (click)="continueWatching()">
            <span class="vsl-cover__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z" /></svg>
            </span>
            كمّل المشاهدة
          </button>
          <button type="button" class="vsl-cover__btn" (click)="restart()">
            <span class="vsl-cover__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7" /><path d="M4 4v4.5h4.5" /></svg>
            </span>
            ابدأ من البداية
          </button>
        </div>
      </div>

      <div class="video-error" *ngIf="hasFatalError" role="alert">
        <p class="video-error-text">تعذّر تشغيل الفيديو. تأكد من اتصالك بالإنترنت.</p>
        <button type="button" class="video-error-retry" (click)="retryPlayback()">إعادة المحاولة</button>
      </div>

      <!-- Always-on controls: play/pause, the eased progress line, playback speed -->
      <div class="vsl-controls" *ngIf="!hasFatalError && !showCover" dir="ltr">
        <div class="vsl-controls__row">
          <button type="button" class="vsl-ctrl" (click)="togglePlay()" [attr.aria-label]="state === 'playing' ? 'إيقاف مؤقت' : 'تشغيل'">
            <svg *ngIf="state !== 'playing'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
            <svg *ngIf="state === 'playing'" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1" /><rect x="13.9" y="5" width="3.6" height="14" rx="1" /></svg>
          </button>

          <button type="button" class="vsl-ctrl vsl-ctrl--speed" (click)="cycleSpeed()" [attr.aria-label]="'سرعة التشغيل ' + formatSpeed(speed)">
            <span class="vsl-speed-label" *ngIf="speed !== 1">{{ formatSpeed(speed) }}</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4.5 17a8.5 8.5 0 1 1 15 0" /><path d="M12 13l4-4" /></svg>
          </button>
        </div>

        <div class="vsl-progress" aria-hidden="true">
          <div class="vsl-progress__fill" [style.width.%]="displayProgress"></div>
        </div>
      </div>
    </div>

    <div class="answer-prompt" data-aos="fade-up" data-aos-delay="180">
      جاوب على الأسئلة ليكتمل تسجيلك وتنضم لمجموعة الواتساب
    </div>
  </div>
</section>
