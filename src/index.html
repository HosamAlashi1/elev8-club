<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <title>Elev8 Club</title>
  <base href="/" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <!-- Google Tag Manager -->
  <script>

      w[l] = w[l] || [];
      w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });

        j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : '';
      j.async = true;

      f.parentNode.insertBefore(j, f);

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap"
    rel="stylesheet" />

  <style>
    #lottie-loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #lottie-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #lottie-animation {
      width: min(50vw, 320px);
      height: min(50vw, 320px);
    }

    #lottie-loader::after {
      content: "";
      width: 44px;
      height: 44px;
      border: 3px solid rgba(15, 23, 42, 0.16);
      border-top-color: #0f172a;
      border-radius: 50%;
      animation: index-loader-spin 0.8s linear infinite;
    }

    #lottie-loader.has-lottie::after {
      display: none;
    }

    #lottie-loader[data-slow="true"]::before {
      content: "التحميل أخذ وقت أكثر من المعتاد. حدّث الصفحة إذا استمر.";
      position: absolute;
      bottom: calc(50% - 180px);
      width: min(86vw, 420px);
      color: #334155;
      font-family: "Tajawal", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.7;
      text-align: center;
    }

    @keyframes index-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>

  <link href="/assets/css/libs.bundle.css" rel="stylesheet" />
  <link href="/assets/css/theme.bundle.css" rel="stylesheet" />
  <link href="/assets/css/toastr.css" rel="stylesheet" />

  <!-- Swiper Web Component -->
  <script defer src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-element-bundle.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

</head>

<body>

  <!-- Google Tag Manager (noscript) -->
  <noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MHN9ZXF4" height="0" width="0"
      style="display:none;visibility:hidden"></iframe>
  </noscript>
  <!-- End Google Tag Manager (noscript) -->

  <app-root>
    <div id="lottie-loader">
      <div id="lottie-animation"></div>
    </div>
  </app-root>

  <!-- Lottie -->
  <script>
    (function () {
      var loader = document.getElementById('lottie-loader');
      var lottieAnimation = document.getElementById('lottie-animation');

      window.startIndexLottie = function () {
        if (!loader || !lottieAnimation || !window.lottie || lottieAnimation.dataset.loaded === 'true') return;

        lottieAnimation.dataset.loaded = 'true';
        loader.classList.add('has-lottie');
        window.lottie.loadAnimation({
          container: lottieAnimation,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: '/assets/json/trading-loader.json'
        });
      };

      window.setTimeout(function () {
        var activeLoader = document.getElementById('lottie-loader');
        if (activeLoader) activeLoader.setAttribute('data-slow', 'true');
      }, 12000);
    })();
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/lottie-web/build/player/lottie.min.js"
    onload="window.startIndexLottie && window.startIndexLottie()"></script>

</body>

</html>
